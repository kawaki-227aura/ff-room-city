<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050908"><title>Owner Panel | KAWAKI227</title>
<style>
:root{--bg:#030706;--card:#08130e;--line:#1b4632;--green:#00ff91;--text:#effaf4;--muted:#81998d;--red:#ff5574}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -5%,#123b27,transparent 38%),#020504;color:var(--text);font-family:Inter,system-ui,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(#00ff9109 1px,transparent 1px),linear-gradient(90deg,#00ff9109 1px,transparent 1px);background-size:44px 44px}.wrap{width:min(980px,100%);margin:auto;padding:22px 16px 60px;position:relative}.card{border:1px solid var(--line);background:#06100bde;border-radius:22px;box-shadow:0 18px 60px #000b;padding:20px;margin-bottom:16px}.login{max-width:460px;margin:9vh auto 0;text-align:center}.avatar{width:110px;height:110px;border-radius:50%;object-fit:cover;border:2px solid var(--green);box-shadow:0 0 35px #00ff9130}.tag{display:inline-block;margin-top:12px;padding:6px 10px;border:1px solid #236542;border-radius:999px;color:#9fffd0;font-size:11px;font-weight:900}.title{font-size:28px;font-weight:1000;margin:12px 0 5px}.muted{color:var(--muted);font-size:13px;line-height:1.55}.field{display:grid;gap:7px;text-align:left;margin:18px 0}.field label{font-size:10px;text-transform:uppercase;color:#789188;font-weight:900;letter-spacing:.8px}.field input{width:100%;height:54px;background:#020805;border:1px solid var(--line);border-radius:13px;color:#fff;padding:0 15px;font-size:17px;outline:0}.field input:focus{border-color:var(--green)}button{font:inherit;cursor:pointer}.primary,.danger,.ghost{border-radius:12px;height:50px;padding:0 16px;font-weight:1000}.primary{border:0;background:linear-gradient(90deg,#00ff91,#00d9ff);color:#00130b;width:100%}.danger{border:1px solid #6b2b3b;background:#210b12;color:#ff9caf}.ghost{border:1px solid var(--line);background:#08150f;color:#bde8d2}.top{display:flex;align-items:center;gap:14px;justify-content:space-between}.top h1{margin:0;font-size:24px}.owner{display:flex;align-items:center;gap:10px}.owner img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:1px solid var(--green)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stat{padding:13px;border:1px solid var(--line);border-radius:14px;background:#07110c}.stat b{display:block;font-size:21px;color:var(--green)}.stat span{font-size:10px;color:var(--muted)}.tools{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.room{border:1px solid var(--line);background:linear-gradient(145deg,#09150f,#06100b);border-radius:18px;padding:15px;margin-top:10px}.roomtop{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{background:#07301f;color:var(--green);padding:6px 9px;border-radius:8px;font-weight:1000;font-size:12px}.room h3{margin:10px 0 8px;font-size:20px}.lines{display:grid;gap:5px;color:#a9bdb4;font-size:12px}.roomfoot{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:13px}.check{display:flex;gap:7px;align-items:center;color:#a9bdb4;font-size:11px}.check input{accent-color:var(--green);width:18px;height:18px}.hidden{display:none!important}.error{color:#ff9caf;font-size:12px;margin-top:10px}.ok{color:#9fffd0;font-size:12px;margin-top:10px}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:span 2}.top{align-items:flex-start}.owner span{display:none}}
</style></head><body><div class="wrap">
<section id="login" class="card login"><img class="avatar" src="https://files.catbox.moe/3bdk80.jpg" alt="KAWAKI227"><div class="tag">OWNER • KAWAKI227</div><div class="title">FF ROOM CITY</div><div class="muted">Espace privé du propriétaire. Le code n'est jamais stocké dans le code public du site.</div><form id="loginForm"><div class="field"><label>Code d'accès propriétaire</label><input id="code" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Entrer le code" required></div><button class="primary">ACCÉDER AU PANEL</button></form><div id="loginMsg"></div></section>
<section id="panel" class="hidden"><div class="card"><div class="top"><div><h1>⚡ OWNER PANEL</h1><div class="muted">Gestion des rooms • suppression sécurisée</div></div><div class="owner"><img src="https://files.catbox.moe/3bdk80.jpg" alt="KAWAKI227"><span>KAWAKI227</span></div></div><div class="stats"><div class="stat"><b id="total">0</b><span>ROOMS ACTIVES</span></div><div class="stat"><b id="selected">0</b><span>SÉLECTIONNÉES</span></div><div class="stat"><b id="ttl">24h</b><span>EXPIRATION AUTO</span></div></div><div class="tools"><button class="ghost" id="refresh">↻ Actualiser</button><button class="danger" id="deleteSelected">🗑️ Supprimer sélectionnées</button><button class="ghost" id="logout">Déconnexion</button></div><div id="msg"></div></div><div class="card"><div class="top"><h2 style="margin:0;font-size:18px">Toutes les rooms</h2><span class="muted">jusqu'à 500</span></div><div id="rooms"></div></div></section>
</div><script>
const TOKEN="ffrc_admin_token_v33";const $=s=>document.querySelector(s);let rooms=[];function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}function fmt(s){if(!s)return"—";const d=new Date(s);return isNaN(d)?"—":d.toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}function token(){return sessionStorage.getItem(TOKEN)||""}function setMsg(t,ok=false){$("#msg").className=ok?"ok":"error";$("#msg").textContent=t}function updateSelected(){$("#selected").textContent=document.querySelectorAll(".pick:checked").length}
function render(){ $("#total").textContent=rooms.length;$("#rooms").innerHTML=rooms.length?rooms.map(r=>`<article class="room"><div class="roomtop"><span class="badge">${esc(r.type)}</span><span class="muted">#${r.id}</span></div><h3>${esc(r.creator)}</h3><div class="lines"><div>🎁 ${esc(r.reward)}</div><div>🆔 ${esc(r.squad_id)}</div><div>📞 ${esc(r.phone)}</div><div>🕒 ${fmt(r.match_time)}</div><div>⌛ Expire le ${fmt(r.expires_at)}</div></div><div class="roomfoot"><label class="check"><input class="pick" type="checkbox" value="${r.id}"> Sélectionner</label><button class="danger one" data-id="${r.id}">🗑️ SUPPRIMER</button></div></article>`).join(""):"<div class='muted' style='padding:25px 0'>Aucune room active.</div>";document.querySelectorAll(".pick").forEach(x=>x.onchange=updateSelected);document.querySelectorAll(".one").forEach(b=>b.onclick=()=>deleteOne(Number(b.dataset.id)))}
async function load(){const res=await fetch("/api/admin/rooms",{headers:{Authorization:"Bearer "+token()},cache:"no-store"});if(res.status===401){sessionStorage.removeItem(TOKEN);location.reload();return}const d=await res.json();if(!res.ok)throw new Error(d.error||"Erreur");rooms=d.rooms||[];render();try{const c=await fetch("/api/config").then(r=>r.json());$("#ttl").textContent=c.roomTtlHours+"h"}catch(_){} }
async function del(ids){const res=await fetch("/api/admin/rooms/delete-many",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token()},body:JSON.stringify({ids})});const d=await res.json();if(!res.ok)throw new Error(d.error||"Suppression impossible");return d.deleted||0}
async function deleteOne(id){if(!confirm("Supprimer définitivement cette room ?"))return;try{await del([id]);setMsg("Room supprimée.",true);await load()}catch(e){setMsg(e.message)}}
$("#loginForm").onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector("button");b.disabled=true;b.textContent="VÉRIFICATION...";try{const res=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:$("#code").value})});const d=await res.json();if(!res.ok)throw new Error(d.error||"Accès refusé");sessionStorage.setItem(TOKEN,d.token);$("#login").classList.add("hidden");$("#panel").classList.remove("hidden");await load()}catch(e){$("#loginMsg").className="error";$("#loginMsg").textContent=e.message}finally{b.disabled=false;b.textContent="ACCÉDER AU PANEL"}};
$("#refresh").onclick=()=>load().catch(e=>setMsg(e.message));$("#logout").onclick=()=>{sessionStorage.removeItem(TOKEN);location.reload()};$("#deleteSelected").onclick=async()=>{const ids=[...document.querySelectorAll(".pick:checked")].map(x=>Number(x.value));if(!ids.length)return setMsg("Sélectionne au moins une room.");if(!confirm(`Supprimer ${ids.length} room(s) ?`))return;try{const n=await del(ids);setMsg(`${n} room(s) supprimée(s).`,true);await load()}catch(e){setMsg(e.message)}};
if(token()){$("#login").classList.add("hidden");$("#panel").classList.remove("hidden");load().catch(e=>setMsg(e.message))}
</script></body></html>
